services:
  mysql:
    image: mysql:8.0
    container_name: pashu-erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-pashupassword}
      MYSQL_DATABASE: ${DB_NAME:-pashu_erp}
      MYSQL_USER: ${DB_USER:-pashu}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pashupassword}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 30s
    networks:
      - pashu_erp_net


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped
    networks:
      - pashu_erp_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http=require('http'); http.get('http://localhost:5000/health', res => { process.exit(res.statusCode===200?0:1) }).on('error', ()=>process.exit(1));\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./.env:/usr/src/app/.env:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_API_SECRET=${VITE_API_SECRET}
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_API_SECRET=${VITE_API_SECRET}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pashu_erp_net
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  pashu_erp_net:
    driver: bridge

volumes:
  mysql_data:
